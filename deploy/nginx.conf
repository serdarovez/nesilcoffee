# NesilCoffee — nginx site.
#
# setup-server.sh substitutes __DOMAIN__ and __UPLOAD_DIR__ before installing
# this to /etc/nginx/sites-available/nesilcoffee. certbot later rewrites the
# file in place to add the 443 server block and the http→https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Uploads are capped at 2400px on the long edge but arrive as originals.
    client_max_body_size 25M;

    # Compress what Next serves uncompressed. Images are already WebP/AVIF.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # ----------------------------------------------------------------------
    # Uploaded media — served straight off disk, never reaching Node.
    # src/app/uploads/[...path]/route.ts is the development equivalent.
    # ----------------------------------------------------------------------
    location /uploads/ {
        alias __UPLOAD_DIR__/;
        access_log off;
        # Generated filenames are content-random and never reused.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ----------------------------------------------------------------------
    # Next.js build output — immutable, hashed filenames.
    # ----------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ----------------------------------------------------------------------
    # Everything else → the Node process.
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;

        # Required by src/server/geo.ts for first-visit language detection and
        # by the per-IP submission rate limit. Without these every visitor
        # looks like 127.0.0.1 and both features quietly stop working.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # The locale redirect at / is per-visitor (IP + headers) and already sends
    # Cache-Control: no-store from proxy.ts. Nothing here may cache it.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
